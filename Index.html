
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub User Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <main class="container">
        <h1>GitHub User Explorer</h1>
        <p>Search GitHub users</p>

        <form id="searchForm">
            <input
                type="text"
                id="username"
                placeholder="Enter your GitHub Username"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="loading" hidden>Loading...</p>
        <p id="errorMessage"></p>

        <section id="profile" hidden>
            <img id="avatar" src="" alt="GitHub User Avatar">
            <h2 id="name"></h2>
            <ul id="repoList"></ul>
        </section>
    </main>
</body>
</html>
